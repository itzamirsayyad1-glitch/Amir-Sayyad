<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b30"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#0b1e33"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="18" y="18" width="476" height="476" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Geometric accent lines -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Central Shield / Badge -->
  <polygon points="256,76 396,146 396,336 256,436 116,336 116,146" fill="#0c233c" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="256,92 380,154 380,324 256,418 132,324 132,154" fill="#091b2f" opacity="0.9"/>

  <!-- Tech / Circuit nodes -->
  <circle cx="256" cy="115" r="5" fill="#FFE082"/>
  <circle cx="360" cy="168" r="4" fill="#38BDF8"/>
  <circle cx="152" cy="168" r="4" fill="#38BDF8"/>
  <circle cx="256" cy="395" r="5" fill="#FFE082"/>

  <!-- Glowing letter M -->
  <path d="M 170 310 L 170 185 L 222 255 L 256 300 L 290 255 L 342 185 L 342 310" 
        fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Stylized number 1 overlaid dynamically in cyan/white -->
  <g transform="translate(256, 252)">
    <circle cx="0" cy="0" r="46" fill="#061626" stroke="url(#goldGrad)" stroke-width="4"/>
    <text x="0" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="58" fill="#38BDF8" text-anchor="middle">1</text>
  </g>

  <!-- Store Name Text -->
  <text x="256" y="475" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="24" fill="#F8FAFC" letter-spacing="4" text-anchor="middle">M1 ENTERPRISES</text>
</svg>
